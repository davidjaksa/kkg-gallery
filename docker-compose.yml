services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    init: true
    environment:
      DATABASE_URL: file:/app/data/gallery.db?connection_limit=1
    mem_limit: 1g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - kkg-db:/app/data
      - kkg-uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  kkg-db:
  kkg-uploads:
